<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Leaderboard</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    margin: 0;
    padding: 12px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 10px;
  }

  .refresh {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 10px;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
    background: #111827;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #1f2937;
    font-size: 14px;
  }

  th {
    background: #0f172a;
    position: sticky;
    top: 0;
  }

  tr:hover {
    background: #1f2937;
  }

  .first-place {
    background: linear-gradient(90deg, #facc15, #f59e0b);
    color: black;
    font-weight: bold;
  }

  .golden-boot {
    font-weight: bold;
    color: #facc15;
  }

  @media (max-width: 600px) {
    th, td {
      font-size: 12px;
      padding: 8px;
    }
  }
</style>
</head>

<body>

<h1>🏆 Live Leaderboard</h1>
<div class="refresh" id="refreshText">Loading...</div>

<div class="table-container">
  <table id="leaderboard"></table>
</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQPFnmAZG7QiOJTpcCWUSZQbkN90EAJfJQaf8BacjBBRkNzloun10HnMdLBzFWZt-qU4JHZaVb3I80/pub?gid=1567052873&single=true&output=csv";

// 🔥 Only show these columns (customize if needed)
const ALLOWED_COLUMNS = [
  "Name",
  "Total",
  "Golden Boot Projection"
];

const POINTS_COLUMN = "Total";
const GOLDEN_BOOT_COLUMN = "Golden Boot Projection";

async function loadLeaderboard() {
  const res = await fetch(CSV_URL + "&cache=" + new Date().getTime());
  const text = await res.text();

  const rows = text.trim().split("\n").map(r => r.split(","));

  let headers = rows[0];
  let data = rows.slice(1);

  // Map allowed column indexes
  let colIndexMap = {};
  ALLOWED_COLUMNS.forEach(col => {
    colIndexMap[col] = headers.indexOf(col);
  });

  const pointsIndex = colIndexMap[POINTS_COLUMN];
  const gbIndex = colIndexMap[GOLDEN_BOOT_COLUMN];

  // Build player objects
  let players = data.map(row => ({
    row,
    points: parseFloat(row[pointsIndex]) || 0
  }));

  // Sort by Total DESC
  players.sort((a, b) => b.points - a.points);

  const table = document.getElementById("leaderboard");

  let html = "<tr>";

  // Render only allowed headers
  ALLOWED_COLUMNS.forEach(col => {
    if (colIndexMap[col] !== -1) {
      html += `<th>${col}</th>`;
    }
  });

  html += "</tr>";

  players.forEach((player, index) => {
    const row = player.row;

    let rowClass = index === 0 ? "first-place" : "";

    html += `<tr class="${rowClass}">`;

    ALLOWED_COLUMNS.forEach(col => {
      const i = colIndexMap[col];
      if (i === -1) return;

      let cell = row[i] ?? "";

      let cellClass = "";
      if (col === GOLDEN_BOOT_COLUMN) {
        cellClass = "golden-boot";
      }

      html += `<td class="${cellClass}">${cell}</td>`;
    });

    html += "</tr>";
  });

  table.innerHTML = html;

  document.getElementById("refreshText").innerText =
    "Last updated: " + new Date().toLocaleTimeString();
}

loadLeaderboard();
setInterval(loadLeaderboard, 30000);

</script>

</body>
</html>
