<!DOCTYPE html>
<html>
<head>
    <title>World Cup Leaderboard</title>
</head>
<body>

<h2>Loading Leaderboard...</h2>

<table border="1">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Total</th>
            <th>Projection</th>
            <th>Goals</th>
        </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
</table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQPFnmAZG7QiOJTpcCWUSZQbkN90EAJfJQaf8BacjBBRkNzloun10HnMdLBzFWZt-qU4JHZaVb3I80/pub?gid=1567052873&single=true&output=csv";

async function load() {
    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = text.trim().split("\n").map(r => r.split(","));

    const headers = rows[0].map(h => h.trim().toLowerCase());

    const name = headers.indexOf("name");
    const total = headers.indexOf("total");
    const proj = headers.indexOf("golden boot projection");
    const goals = headers.indexOf("projected goals");

    const data = rows.slice(1).map(r => ({
        name: r[name],
        total: r[total],
        proj: r[proj],
        goals: r[goals]
    })).filter(x => x.name);

    data.sort((a,b)=>b.total-a.total);

    const tbody = document.getElementById("leaderboard");
    tbody.innerHTML = "";

    data.forEach((d,i)=>{
        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${d.name}</td>
            <td>${d.total}</td>
            <td>${d.proj}</td>
            <td>${d.goals}</td>
        </tr>`;
    });
}

load();
</script>

</body>
</html>
