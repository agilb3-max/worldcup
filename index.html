<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    th {
      background: #111827;
    }

    tr:hover {
      background: #334155;
    }
  </style>
</head>

<body>

<h1>🏆 Leaderboard</h1>
<table id="leaderboard"></table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQPFnmAZG7QiOJTpcCWUSZQbkN90EAJfJQaf8BacjBBRkNzloun10HnMdLBzFWZt-qU4JHZaVb3I80/pub?gid=1567052873&single=true&output=csv";

async function loadLeaderboard() {
  const response = await fetch(CSV_URL);
  const data = await response.text();

  const rows = data.trim().split("\n").map(r => r.split(","));

  const table = document.getElementById("leaderboard");

  // Build header
  let html = "<tr>";
  rows[0].forEach(header => {
    html += `<th>${header}</th>`;
  });
  html += "</tr>";

  // Build rows
  for (let i = 1; i < rows.length; i++) {
    html += "<tr>";
    rows[i].forEach(cell => {
      html += `<td>${cell}</td>`;
    });
    html += "</tr>";
  }

  table.innerHTML = html;
}

loadLeaderboard();
</script>

</body>
</html>
