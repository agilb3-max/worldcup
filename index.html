<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
</head>
<body>

<h2>Loading Leaderboard...</h2>

<table border="1">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Total</th>
            <th>Projection</th>
            <th>Goals</th>
        </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
</table>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQPFnmAZG7QiOJTpcCWUSZQbkN90EAJfJQaf8BacjBBRkNzloun10HnMdLBzFWZt-qU4JHZaVb3I80/pub?gid=1567052873&single=true&output=csv";

async function loadLeaderboard() {
    const res = await fetch(CSV_URL);
    const csv = await res.text();

    const rows = csv.trim().split("\n").map(r => r.split(","));

    const headers = rows[0].map(h => h.toLowerCase().trim());

    const nameIndex = headers.indexOf("name");
    const totalIndex = headers.indexOf("total");
    const projectionIndex = headers.indexOf("golden boot projection");
    const goalsIndex = headers.indexOf("projected goals");

    const data = rows.slice(1)
        .map(r => ({
            name: r[nameIndex],
            total: Number(r[totalIndex]) || 0,
            projection: r[projectionIndex],
            goals: r[goalsIndex]
        }))
        .filter(r => r.name);

    data.sort((a,b)=>b.total-a.total);

    const tbody = document.getElementById("leaderboard");
    tbody.innerHTML = "";

    data.forEach((d,i)=>{
        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${d.name}</td>
            <td>${d.total}</td>
            <td>${d.projection}</td>
            <td>${d.goals}</td>
        </tr>`;
    });
}

loadLeaderboard();

</script>

</body>
</html>
