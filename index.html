<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup Leaderboard</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#08111f;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.last-update{
    text-align:center;
    font-size:12px;
    opacity:.7;
    margin-bottom:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111827;
    border-radius:12px;
    overflow:hidden;
}

th{
    background:#0f172a;
    padding:12px;
    font-size:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #1f2937;
}

tr:hover{
    background:#1f2937;
}

.rank{
    font-weight:bold;
    width:60px;
    text-align:center;
}

.name{
    font-weight:bold;
}

.teams{
    text-align:left;
    max-width:500px;
    line-height:1.4;
}

.total{
    font-weight:bold;
    font-size:16px;
}

.goldenboot{
    color:#facc15;
    font-weight:bold;
}

.first-place{
    background:linear-gradient(
        90deg,
        #facc15,
        #f59e0b
    );
    color:black;
    font-weight:bold;
}

.first-place .goldenboot{
    color:black;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    th,
    td{
        font-size:12px;
        padding:8px;
    }

    .teams{
        min-width:250px;
    }

}

</style>
</head>

<body>

<h1>🏆 World Cup Leaderboard</h1>

<div class="last-update" id="updated">
Loading...
</div>

<div class="table-wrap">
<table id="leaderboard"></table>
</div>

<script>

// PASTE YOUR PUBLISHED CSV LINK HERE
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTQPFnmAZG7QiOJTpcCWUSZQbkN90EAJfJQaf8BacjBBRkNzloun10HnMdLBzFWZt-qU4JHZaVb3I80/pub?gid=1567052873&single=true&output=csv";

async function loadLeaderboard() {

    const response =
        await fetch(
            CSV_URL +
            "&cache=" +
            Date.now()
        );

    const text =
        await response.text();

    const rows =
        text
        .trim()
        .split("\n")
        .map(row => row.split(","));

    const headers = rows[0];
    const data = rows.slice(1);

    const nameIndex =
        headers.indexOf("Name");

    const totalIndex =
        headers.indexOf("Total");

    const goldenBootIndex =
        headers.indexOf("Golden Boot Projection");

    const tierIndexes = [
        headers.indexOf("Tier 1"),
        headers.indexOf("Tier 2"),
        headers.indexOf("Tier 3"),
        headers.indexOf("Tier 4"),
        headers.indexOf("Tier 5"),
        headers.indexOf("Tier 6")
    ];

    const players = data.map(row => {

        const teams =
            tierIndexes
            .map(i => i >= 0 ? row[i] : "")
            .filter(team => team && team.trim() !== "")
            .join(", ");

        return {
            name: row[nameIndex],
            teams: teams,
            total: parseFloat(row[totalIndex]) || 0,
            goldenBoot: row[goldenBootIndex] || ""
        };

    });

    players.sort((a,b) => b.total - a.total);

    let html = `
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Teams Picked</th>
            <th>Total Score</th>
            <th>Golden Boot</th>
        </tr>
    `;

    players.forEach((player,index)=>{

        const rowClass =
            index === 0
            ? "first-place"
            : "";

        html += `
        <tr class="${rowClass}">
            <td class="rank">
                ${index + 1}
            </td>

            <td class="name">
                ${player.name}
            </td>

            <td class="teams">
                ${player.teams}
            </td>

            <td class="total">
                ${player.total}
            </td>

            <td class="goldenboot">
                ${player.goldenBoot}
            </td>
        </tr>
        `;
    });

    document
        .getElementById("leaderboard")
        .innerHTML = html;

    document
        .getElementById("updated")
        .innerHTML =
        "Last Updated: " +
        new Date().toLocaleTimeString();

}

loadLeaderboard();

setInterval(
    loadLeaderboard,
    30000
);

</script>

</body>
</html>
